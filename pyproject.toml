[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dcs"
version = "0.5.0"
description = "Discipline Conformance System — attestation, apoptosis, triad, atlas"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Danny-TMIG"}]
dependencies = []

[project.optional-dependencies]
crypto = ["cryptography>=42", "pynacl>=1.5"]
dev = ["pytest>=8", "coverage>=7"]

[project.scripts]
dcs = "dcs.cli:main"

[tool.setuptools.packages.find]
include = ["dcs*"]
exclude = ["dcs.tests*"]

["dcs/tests"]
addopts = "-q"

[tool.coverage.run]
source = ["dcs"]
omit = ["dcs/tests/*", "*/__pycache__/*"]
